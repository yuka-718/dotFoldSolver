name: Build and deploy the web solver

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.64"
          actions-cache-folder: emsdk-cache
      - name: Compile the solver to WebAssembly
        run: >-
          emcc -std=c++20 -O3 --no-entry
          dotToGraph.cpp BoundaryGraph.cpp foldsToEdges.cpp loopToFolds.cpp ftcp.cpp
          -o web/solver.js
          -s MODULARIZE=1
          -s EXPORT_NAME=createDotFoldSolver
          -s ENVIRONMENT=worker
          -s ALLOW_MEMORY_GROWTH=1
          -s INITIAL_MEMORY=268435456
          -s NO_EXIT_RUNTIME=1
          -s EXPORTED_FUNCTIONS='["_dotfold_loop_length","_dotfold_solve"]'
          -s EXPORTED_RUNTIME_METHODS='["ccall"]'
      - name: Prepare site artifact
        run: cp -R web dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
